name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Pinned to the exact version .clang-format was authored/verified
      # against (see the "Apply clang-format to existing source" commit) so
      # this check can't drift out of sync with a distro package upgrade.
      - name: Install clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: find src \( -name '*.cpp' -o -name '*.h' \) -exec clang-format --dry-run --Werror {} +

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Unlike clang-format above, this is deliberately *not* the pip wheel:
      # clang-tidy has to actually parse the code, and the pip build doesn't
      # reliably auto-detect the system GCC's standard library headers on
      # Linux (a known issue — it can miss <vector>/<string>/etc. depending
      # on which GCC version it decides to trust). apt's clang-tidy is built
      # against this distro's own GCC, so it doesn't have that problem.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config clang-tidy \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libmpv-dev

      # clang-tidy needs a compile database to know each file's include
      # paths/defines; it happily analyzes GCC-generated commands with its
      # own (Clang) frontend, so this doesn't need a Clang build at all.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: find src -name '*.cpp' -exec clang-tidy -p build --warnings-as-errors='*' {} +

  # actionlint (below) only shellchecks the inline `run:` blocks inside the
  # workflows; the packaging scripts under ci/ that actually produce the
  # release artifacts are standalone files it never looks at. shellcheck is
  # preinstalled on GitHub's Ubuntu runners.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check CI scripts
        run: shellcheck ci/*.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Lint workflows
        run: ./actionlint -color
