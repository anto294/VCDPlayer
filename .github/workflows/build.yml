name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so pushing a fixup commit
# doesn't burn CI minutes finishing a build nobody will look at. Left alone
# for tag pushes: `github.ref` is unique per tag, so releases are never
# cancelled by unrelated activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: the GITHUB_TOKEN only needs to read the repo to
# build it. The release job below is the sole exception and opts back into
# `contents: write` for itself.
permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            os: windows-latest
          - arch: arm64
            msystem: CLANGARM64
            os: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: zip
          pacboy: >-
            cc:p
            cmake:p
            ninja:p
            pkgconf:p
            qt6-base:p
            qt6-tools:p
            mpv:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package portable build
        run: |
          bash ci/package-windows.sh build/VCDPlayer.exe VCDPlayer-windows-${{ matrix.arch }}-portable

      - uses: actions/upload-artifact@v7
        with:
          name: VCDPlayer-windows-${{ matrix.arch }}-portable
          path: dist/*.zip
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            appimage_arch: x86_64
            os: ubuntu-24.04
          - arch: arm64
            appimage_arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libmpv-dev \
            fuse libfuse2 desktop-file-utils

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package AppImage
        run: |
          bash ci/package-appimage.sh build/VCDPlayer ${{ matrix.appimage_arch }} VCDPlayer-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: VCDPlayer-linux-${{ matrix.arch }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: [windows, linux-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release/ \;

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: release/*
