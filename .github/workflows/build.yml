name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            os: windows-latest
          - arch: arm64
            msystem: CLANGARM64
            os: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: zip
          pacboy: >-
            cc:p
            cmake:p
            ninja:p
            pkgconf:p
            qt6-base:p
            qt6-tools:p
            mpv:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package portable build
        run: |
          ./ci/package-windows.sh build/VCDPlayer.exe VCDPlayer-windows-${{ matrix.arch }}-portable

      - uses: actions/upload-artifact@v4
        with:
          name: VCDPlayer-windows-${{ matrix.arch }}-portable
          path: dist/*.zip

  linux-appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            appimage_arch: x86_64
            os: ubuntu-24.04
          - arch: arm64
            appimage_arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-l10n-tools libmpv-dev \
            fuse libfuse2 desktop-file-utils

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package AppImage
        run: |
          ./ci/package-appimage.sh build/VCDPlayer ${{ matrix.appimage_arch }} VCDPlayer-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: VCDPlayer-linux-${{ matrix.arch }}-appimage
          path: dist/*.AppImage

  release:
    name: Publish draft release
    needs: [windows, linux-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release/ \;

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
